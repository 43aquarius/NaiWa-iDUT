name: Release NaiWa APK

on:
  push:
    tags:
      - 'naiwa-v*'
      - 'release-trigger*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute checksum
        run: |
          sha256sum "i大工_奶蛙版_3.3.12.apk" | tee APK_SHA256.txt
          cat APK_SHA256.txt >> RELEASE_NOTES.md

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # ASCII-safe copy of the APK (GitHub asset names get mangled for non-ASCII)
          cp "i大工_奶蛙版_3.3.12.apk" iDaGong_NaiWa_v2.0.apk
          # v2.0 release tag
          gh release create "naiwa-v2.0" \
            --title "奶蛙 i大工 v2.0 —— 奶龙护送版（修复启动动画/主背景/配色）" \
            --notes-file RELEASE_NOTES.md \
            "iDaGong_NaiWa_v2.0.apk" \
            "theme/preview_sheet.jpg#animation-preview.jpg" \
            "theme/icons/ic_app_launcher.png#icon-preview.png" 2>/dev/null || {
            # release exists: clean old assets then re-upload
            gh release view "naiwa-v2.0" --json assets --jq '.[].name' | while read -r a; do
              gh release delete-asset "naiwa-v2.0" "$a" -y || true
            done
            gh release upload "naiwa-v2.0" \
              "iDaGong_NaiWa_v2.0.apk" \
              "theme/preview_sheet.jpg#animation-preview.jpg" \
              "theme/icons/ic_app_launcher.png#icon-preview.png" --clobber
          }
